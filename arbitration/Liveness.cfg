\* Liveness, 2F1A.  No SYMMETRY: TLC's liveness checking is unsound under it.
\* Bounds cover the fault model (one of three replicas fails, so at most two
\* leaders): configuration sequence numbers <= 2 StartWorking logs + 1
\* confirmation + 1 degrade.
SPECIFICATION LiveSpec

CONSTANTS
  F = {f1, f2}
  A = a
  None = None
  MaxProposal = 3
  MaxLogLen = 1
  MaxConfigSeq = 4

PROPERTY EventuallyStableLeader
PROPERTY WritesCommit
