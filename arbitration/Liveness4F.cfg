\* Liveness, 4F1A.  No SYMMETRY: TLC's liveness checking is unsound under it.
\* Bounds cover the liveness fault model (at most 2 of 5 replicas fail, so at
\* most 3 leaders): proposal_ids <= 3 elections + 2 retries, config seqs <=
\* 3 START_WORKINGs + 2 degrades.
SPECIFICATION LiveSpec

CONSTANTS
  F = {f1, f2, f3, f4}
  A = a
  None = None
  MaxPid = 5
  MaxLogLen = 1
  MaxSeq = 5

PROPERTY EventuallyStableLeader
PROPERTY WritesCommit
