\* Liveness, 4F1A.  No SYMMETRY: TLC's liveness checking is unsound under it.
\* Bounds cover the fault model (at most 2 of 5 replicas fail, so at most 3
\* leaders): proposal numbers <= 3 elections + 2 retries, configuration
\* sequence numbers <= 3 StartWorking logs + 2 confirmations + 2 degrades.
SPECIFICATION LiveSpec

CONSTANTS
  F = {f1, f2, f3, f4}
  A = a
  None = None
  MaxProposal = 5
  MaxLogLen = 1
  MaxConfigSeq = 7

PROPERTY EventuallyStableLeader
PROPERTY WritesCommit
